<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Control</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#CC785C">
<style>
  :root {
    --bg:#f7f5f1; --card:#fff; --ink:#22201d; --muted:#7a746c; --line:#e6e2da;
    --accent:#c96442; --accent-soft:#f9ece5; --good:#177245; --good-soft:#e8f5ee;
    --blue:#2458c5; --blue-soft:#e9effc; --code:#f1eee9; --danger:#b91c1c;
    --shadow:0 1px 3px rgba(30,25,20,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#171614; --card:#201f1c; --ink:#ece9e2; --muted:#9c968e; --line:#343128;
      --accent:#e0855f; --accent-soft:#33221a; --good:#4ade80; --good-soft:#132a1c;
      --blue:#7aa5f8; --blue-soft:#1a2438; --code:#2a2823; --danger:#f87171;
      --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);
       color:var(--ink);line-height:1.6;padding:0 1rem 4rem}
  .wrap{max-width:880px;margin:0 auto}
  header{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;
    padding:.9rem 0 .8rem;border-bottom:1px solid var(--line);margin-bottom:1.3rem;
    position:sticky;top:0;background:var(--bg);z-index:5}
  header img{width:29px;height:29px;border-radius:8px}
  h1{font-size:1.18rem;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:.76rem}
  nav{display:flex;gap:.2rem;margin-inline-start:auto}
  nav button{font:inherit;border:none;background:none;color:var(--muted);
    border-radius:0;padding:.5rem .85rem;cursor:pointer;font-size:.88rem;
    border-bottom:2px solid transparent}
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .flag{border:1px solid transparent;background:none;font-size:1.05rem;cursor:pointer;
    border-radius:7px;padding:.15rem .3rem;line-height:1;opacity:.45}
  .flag.on{opacity:1;border-color:var(--line);background:var(--card)}
  .power{border:1px solid var(--line);background:var(--card);color:var(--muted);width:30px;height:30px;
    border-radius:8px;cursor:pointer;font-size:.9rem;line-height:1}
  .power:hover{color:var(--danger);border-color:var(--danger)}
  .tab{display:none} .tab.on{display:block}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);margin-bottom:1rem}
  section>.shead{display:flex;align-items:center;gap:.55rem;padding:.7rem 1.1rem;
    border-bottom:1px solid var(--line);flex-wrap:wrap;border-radius:12px 12px 0 0;
    background:color-mix(in srgb,var(--card) 70%,var(--bg))}
  section>.shead b{font-size:.92rem;letter-spacing:.01em}
  section>.sbody{padding:.85rem 1.1rem}
  .grid{display:grid;gap:.7rem}
  .g3{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
  .g4{grid-template-columns:repeat(auto-fill,minmax(192px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.8rem 1rem;box-shadow:var(--shadow)}
  .kpi .n{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
  .kpi .l{font-size:.73rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
  .bar{height:6px;background:var(--code);border-radius:99px;overflow:hidden;margin-top:.45rem}
  .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
  .bar i.warn{background:var(--accent)} .bar i.hot{background:var(--danger)}
  .tag{font-size:.66rem;padding:.06rem .5rem;border-radius:99px;font-weight:600;white-space:nowrap}
  .t-live{background:var(--good-soft);color:var(--good)}
  .t-next{background:var(--accent-soft);color:var(--accent)}
  .t-manual{background:var(--code);color:var(--muted)}
  .t-est{background:var(--code);color:var(--muted);font-family:ui-monospace,monospace;direction:ltr}
  .row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
    padding:.55rem 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .name{font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .row .hint{font-size:.74rem;color:var(--muted)}
  .q{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--code);
    color:var(--muted);font-size:.6rem;font-weight:700;align-items:center;justify-content:center;
    cursor:help;flex:none}
  .q:hover{background:var(--ink);color:var(--bg)}
  #tip{position:fixed;background:var(--ink);color:var(--bg);padding:.45rem .7rem;border-radius:8px;
    font-size:.75rem;max-width:270px;line-height:1.5;z-index:100;display:none;
    box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}
  .tg{position:relative;width:38px;height:21px;flex:none;cursor:pointer}
  .tg input{opacity:0;width:0;height:0}
  .tg span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.18s}
  .tg span::before{content:"";position:absolute;height:15px;width:15px;top:3px;inset-inline-start:3px;
    background:var(--card);border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .tg input:checked+span{background:var(--good)}
  .tg input:checked+span::before{transform:translateX(-17px)}
  [dir="ltr"] .tg input:checked+span::before{transform:translateX(17px)}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:.35rem .85rem;cursor:pointer;font-size:.83rem;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.06);color:#fff}
  button.bluebtn{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.bluebtn:hover{filter:brightness(1.06);color:#fff}
  button.ghost{border:none;background:none;color:var(--muted);padding:.15rem .35rem}
  button.ghost:hover{color:var(--danger)}
  code,.cmd{font-family:"SF Mono",ui-monospace,Menlo,monospace;background:var(--code);
    border-radius:6px;padding:.12rem .45rem;font-size:.78em;direction:ltr;unicode-bidi:embed}
  .cmdline .cmd{display:block;overflow-x:auto;white-space:nowrap;padding:.5rem .65rem}
  .preset{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:.85rem 1rem;display:flex;flex-direction:column;gap:.3rem;
    border-inline-start:4px solid var(--line)}
  .preset.k-generic{border-inline-start-color:var(--blue)}
  .preset.k-custom{border-inline-start-color:var(--good)}
  .preset .d{font-size:.78rem;color:var(--muted);flex:1}
  .preset .a{display:flex;gap:.45rem;margin-top:.45rem;flex-wrap:wrap;align-items:center}
  .preset .chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.15rem}
  .divider{border:none;border-top:1px solid var(--line);margin:1.1rem 0}
  .muted{color:var(--muted);font-size:.8rem}
  .chip{font-size:.73rem;background:var(--code);border-radius:99px;padding:.14rem .6rem;direction:ltr}
  select,input[type=text],textarea{font:inherit;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:.34rem .6rem;font-size:.85rem}
  input[type=text]{width:100%}
  textarea{width:100%;min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;direction:ltr}
  .toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);border-radius:99px;padding:.5rem 1.2rem;font-size:.85rem;
    opacity:0;transition:.25s;pointer-events:none;z-index:110;box-shadow:0 4px 18px rgba(0,0,0,.3)}
  .toast.on{opacity:1}
  .overlay{position:fixed;inset:0;background:rgba(15,12,10,.5);display:none;z-index:90;
    align-items:center;justify-content:center;padding:1rem}
  .overlay.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:1.25rem 1.35rem;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal h3{margin-bottom:.8rem;font-size:1.02rem;display:flex;gap:.45rem;align-items:center}
  .field{margin-bottom:.75rem}
  .field>label{display:flex;font-size:.76rem;color:var(--muted);margin-bottom:.25rem;gap:.35rem;align-items:center}
  .field .exp{font-size:.72rem;color:var(--muted);margin-top:.2rem;line-height:1.45}
  .bp{background:var(--blue-soft);border-inline-start:3px solid var(--blue);border-radius:8px;
    padding:.6rem .8rem;font-size:.76rem;line-height:1.55;margin-bottom:.8rem}
  .bp b{display:block;margin-bottom:.15rem}
  .dd{position:relative;display:inline-block}
  .ddbtn{display:inline-flex;align-items:center;gap:.5rem;min-width:160px;justify-content:space-between}
  .ddbtn::after{content:"▾";font-size:.7rem;color:var(--muted)}
  .ddpanel{position:absolute;top:calc(100% + 6px);inset-inline-start:0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);
    padding:.45rem;min-width:250px;max-height:280px;overflow-y:auto;z-index:80;display:none}
  .dd.open .ddpanel{display:block}
  .ddpanel label{display:flex;align-items:center;gap:.55rem;padding:.34rem .5rem;border-radius:8px;
    cursor:pointer;font-size:.85rem}
  .ddpanel label:hover{background:var(--code)}
  .ddpanel .sm{font-size:.7rem;color:var(--muted);margin-inline-start:auto;direction:ltr}
  .brow{padding:.7rem 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .brow>.bt{font-size:.8rem;font-weight:600;margin-bottom:.4rem;display:flex;gap:.4rem;align-items:center;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .brow .exp{font-size:.73rem;color:var(--muted);margin-top:.3rem;line-height:1.5}
  th,td{text-align:start;padding:.42rem .6rem;border-bottom:1px solid var(--line);font-size:.85rem}
  th{color:var(--muted);font-weight:600;font-size:.73rem}
  table{width:100%;border-collapse:collapse}
  .chart{width:100%;overflow-x:auto}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;border-radius:0;font-size:.78rem;padding:.28rem .8rem;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .guide li{font-size:.9rem;margin-bottom:.6rem}
  .guide ol{margin:0 1.3rem .5rem}
  .guide pre{background:var(--code);border-radius:8px;padding:.55rem .8rem;direction:ltr;
    text-align:left;font-size:.8rem;overflow-x:auto;margin:.3rem 0 .2rem;
    font-family:ui-monospace,Menlo,monospace}
  pre.out{background:var(--code);border-radius:10px;padding:.7rem .9rem;direction:ltr;text-align:left;
    font-size:.76rem;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;
    max-height:280px;overflow-y:auto;margin-top:.5rem}
</style>
</head>
<body>
<div class="wrap">
  <!-- header keeps a FIXED layout — it does not flip with the content language -->
  <header dir="rtl">
    <img src="/icon.svg" alt="">
    <div><h1>Claude Control</h1><div class="sub" id="clock"></div></div>
    <nav>
      <button id="tabbtn-new" class="on" onclick="showTab('new')"></button>
      <button id="tabbtn-manage" onclick="showTab('manage')"></button>
      <button id="tabbtn-monitor" onclick="showTab('monitor')"></button>
      <button id="tabbtn-guide" onclick="showTab('guide')"></button>
    </nav>
    <button class="flag" id="fl-he" onclick="setLang('he')" title="עברית">🇮🇱</button>
    <button class="flag" id="fl-en" onclick="setLang('en')" title="English">🇬🇧</button>
    <button class="power" id="refreshBtn" onclick="refreshAll(this)">⟳</button>
    <button class="power" id="powerBtn" onclick="shutdown()">⏻</button>
  </header>

  <div id="content"></div>
</div>

<div id="tip"></div>
<div class="toast" id="toast"></div>
<div id="modals"></div>

<script>

 mine:"הפרופילים שלי",mine_tip:"מתחיל ריק — אתה בונה אותם. כל פרופיל: MCP, סקילים, חוקים, מודל ותיקייה.",

document.addEventListener("mouseover",e=>{
  const q=e.target.closest(".q");const tip=$("tip");
  if(!q){tip.style.display="none";return;}
  tip.textContent=q.dataset.tip||"";tip.style.display="block";
  const r=q.getBoundingClientRect(),tw=tip.offsetWidth;
  let x=r.left+r.width/2-tw/2;x=Math.max(8,Math.min(x,innerWidth-tw-8));
  tip.style.left=x+"px";
  tip.style.top=(r.bottom+8+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-8:r.bottom+8)+"px";
});

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",body:JSON.stringify(body)}:{});
  const j=await r.json();
  if(j.error){toast(t("err")+j.error);throw j.error;}
  if(j.state){S=j.state;renderAll();}
  return j;
}

function renderAll(){
  if(!S)return;
  const keepMcp=getChecked("pf"),keepRules=getChecked("rl"),
        keepCwd=$("cCwd")?.value||"",keepModel=$("cModel")?.value||"",
        keepSkills=$("cSkills")?.checked??true,keepBare=$("cBare")?.checked??false;
  renderPresets();
  ddPanel($("pnMcp"),"pf",S.mcp_profiles.filter(p=>p.file!=="none.json")
    .map(p=>({v:p.file,l:p.file.replace(".json",""),h:p.servers.join(", ")})),keepMcp);
  ddPanel($("pnRules"),"rl",S.rules.map(r=>({v:r.file,l:r.file.replace(/\.mdc?$/,""),h:`~${r.tokens}k`})),keepRules);
  $("repoList").innerHTML=(S.repos||[]).map(r=>`<option value="${esc(r)}">`).join("");
  const mopts=`<option value="">${t("model_def")}</option>`+S.models.map(m=>`<option value="${m}">${m}</option>`).join("");
  $("cModel").innerHTML=mopts;$("edModel").innerHTML=mopts;
  $("cCwd").value=keepCwd;$("cModel").value=keepModel;
  $("cSkills").checked=keepSkills;$("cBare").checked=keepBare;
  updCmd();
  renderAccount();renderSettings();renderFiles();renderMcp();renderHooks();
  renderRules();renderSkills();renderDesktop();renderDashCfg();
}
function presetCard(p){
  const name=p.custom?p.name:(I18N[L]["bp_"+p.id+"_n"]||p.name);
  const desc=p.custom?(p.desc||""):(I18N[L]["bp_"+p.id+"_d"]||p.desc||"");
  const chips=[
    ...(p.profiles===null?["plugins+project"]:(p.profiles||[]).map(x=>x.replace(".json",""))),
    p.bare?"bare":null,p.skills&&!p.bare?"skills":null,p.model||null,
    ...(p.rules||[]).map(r=>r.replace(/\.mdc?$/,""))].filter(Boolean);
  return `<div class="preset k-${p.kind==="custom"?"custom":"generic"}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.4rem">
      <b>${esc(name)}</b>
      <span style="display:flex;gap:.15rem;align-items:center">
        <span class="tag t-est q" data-tip="${esc(t("est_tip"))}">~${p.est}k</span>
        ${p.custom?`<button class="ghost" title="${t("edit")}" onclick="editPreset('${p.id}')">✎</button>
                    <button class="ghost" title="${t("del")}" onclick="delPreset('${p.id}')">✕</button>`
                  :`<button class="ghost" title="${t("dup")}" onclick="dupPreset('${p.id}')">⧉</button>`}
      </span></div>
    <div class="d">${esc(desc)}${p.cwd?` · <span class="cmd">${esc(p.cwd)}</span>`:""}</div>
    <div class="chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="a">
      <button class="${p.kind==="custom"?"primary":"bluebtn"}" onclick="askTarget({preset:'${p.id}'})">${t("open_session")}</button>
      <button onclick="copyPreset('${p.id}')">${t("copy_cmd")}</button></div></div>`;
}
function renderPresets(){
  $("presetsGeneric").innerHTML=S.presets.filter(p=>!p.custom).map(presetCard).join("");
  $("presetsCustom").innerHTML=S.presets.filter(p=>p.custom).map(presetCard).join("")
    ||`<div class="muted" style="padding:.4rem 0">${t("empty_mine")}</div>`;
}
function ddPanel(el,name,items,selected){
  el.innerHTML=items.length?items.map(i=>`
    <label><input type="checkbox" name="${name}" value="${i.v}" ${selected.includes(i.v)?"checked":""}
      onchange="updCmd()"> ${esc(i.l)}<span class="sm">${esc(i.h||"")}</span></label>`).join("")
    :`<div class="muted" style="padding:.3rem .5rem">${t("none")}</div>`;
}
const getChecked=n=>[...document.querySelectorAll(`input[name=${n}]:checked`)].map(i=>i.value);
function customSpec(){
  return {profiles:getChecked("pf"),rules:getChecked("rl"),skills:$("cSkills").checked,
          bare:$("cBare").checked,cwd:$("cCwd").value.trim(),model:$("cModel").value};
}
let cmdTimer=null;
function updCmd(){
  $("cntMcp").textContent=getChecked("pf").length;
  $("cntRules").textContent=getChecked("rl").length;
  clearTimeout(cmdTimer);
  cmdTimer=setTimeout(async()=>{
    const r=await fetch("/api/launch",{method:"POST",
      body:JSON.stringify({custom:customSpec(),target:{type:"terminal"},dry:true})});
    const j=await r.json();
    if(j.cmd){$("customCmd").textContent=j.cmd;$("customCmd").dataset.full=j.cmd;
      $("customEst").textContent=`~${j.est}k ${t("est_start")}`;}
  },150);
}
function copyCmd(){navigator.clipboard.writeText($("customCmd").dataset.full||"").then(()=>toast(t("copied")));}
function copyPreset(id){const p=S.presets.find(x=>x.id===id);
  if(p)navigator.clipboard.writeText(p.cmd).then(()=>toast(t("copied")));}

function chipChecks(el,name,items,selected){
  el.innerHTML=items.length?items.map(i=>`
    <label class="chip" style="cursor:pointer"><input type="checkbox" name="${name}" value="${i.v}"
      ${selected.includes(i.v)?"checked":""} style="vertical-align:middle"> ${esc(i.l)}</label>`).join("")
    :`<span class="muted">${t("none")}</span>`;
}
function editPreset(id){
  editingId=id;
  const p=id?S.presets.find(x=>x.id===id):null;
  $("edTitle").textContent=p?t("profile_edit")+p.name:t("profile_new");
  $("edName").value=p?p.name:"";$("edDesc").value=p?(p.desc||""):"";
  $("edSkills").checked=p?p.skills!==false:true;$("edBare").checked=p?!!p.bare:false;
  $("edModel").value=p?(p.model||""):"";$("edCwd").value=p?(p.cwd||""):"";
  chipChecks($("edProfiles"),"edpf",S.mcp_profiles.filter(x=>x.file!=="none.json")
    .map(x=>({v:x.file,l:x.file.replace(".json","")})),p?(p.profiles||[]):[]);
  chipChecks($("edRules"),"edrl",S.rules.map(r=>({v:r.file,l:r.file.replace(/\.mdc?$/,"")})),p?(p.rules||[]):[]);
  $("ovEdit").classList.add("on");
}
function dupPreset(id){
  const p=S.presets.find(x=>x.id===id);if(!p)return;
  editPreset(null);
  $("edName").value=p.name+t("mine_suffix");$("edDesc").value=p.desc||"";
  $("edSkills").checked=p.skills!==false;$("edBare").checked=!!p.bare;
  [...document.querySelectorAll("input[name=edpf]")].forEach(i=>i.checked=(p.profiles||[]).includes(i.value));
}
function savePreset(){
  api("/api/preset",{id:editingId,name:$("edName").value,desc:$("edDesc").value,
    profiles:getChecked("edpf"),rules:getChecked("edrl"),
    skills:$("edSkills").checked,bare:$("edBare").checked,
    cwd:$("edCwd").value.trim(),model:$("edModel").value})
  .then(()=>{closeOv("ovEdit");toast(t("saved"));});
}
function delPreset(id){if(confirm(t("confirm_del_p")))api("/api/preset/delete",{id}).then(()=>toast(t("deleted")));}
function saveAsPreset(){
  const c=customSpec();editPreset(null);
  $("edName").value=t("profile_new");
  [...document.querySelectorAll("input[name=edpf]")].forEach(i=>i.checked=c.profiles.includes(i.value));
  [...document.querySelectorAll("input[name=edrl]")].forEach(i=>i.checked=c.rules.includes(i.value));
  $("edSkills").checked=c.skills;$("edBare").checked=c.bare;
  $("edModel").value=c.model;$("edCwd").value=c.cwd;
}
function closeOv(id){$(id).classList.remove("on");if(id==="ovEdit")editingId=null;if(id==="ovRule")editingRule=null;}

function askTarget(what){
  pendingLaunch=what;
  const saved=localStorage.getItem("cc-target")||"";
  const opts=[
    ...S.tmux.map(s=>({v:"tmux:"+s.name,l:`tmux · ${s.name}`,h:`${s.windows} ${t("tabs_w")}${s.attached?" · "+t("attached"):""}`})),
    ...(S.tmux_available?[{v:"tmux:__new__",l:t("tmux_new"),h:t("tmux_new_h")}]:[]),
    {v:"terminal",l:t("term_new"),h:t("term_new_h")}];
  $("targetList").innerHTML=opts.map((o,i)=>`
    <label class="row" style="cursor:pointer">
      <div><div class="name">${esc(o.l)}</div><div class="hint">${esc(o.h)}</div></div>
      <input type="radio" name="tgt" value="${o.v}" ${o.v===saved||(!saved&&i===0)?"checked":""}></label>`).join("");
  $("ovTarget").classList.add("on");
}
function doLaunch(){
  const v=(document.querySelector("input[name=tgt]:checked")||{}).value||"terminal";
  localStorage.setItem("cc-target",v);
  const wantQr=$("wantQr")?.checked&&v.startsWith("tmux:");
  const target=v.startsWith("tmux:")?{type:"tmux",session:v.slice(5)}:{type:"terminal"};
  api("/api/launch",{...pendingLaunch,target}).then(j=>{
    closeOv("ovTarget");
    toast(j.tmux?`${t("opened_tmux")} ${j.tmux} ✓`:t("opened_term"));
    if(wantQr&&j.tmux)showRemote(j.tmux);
  });
}

async function runDoctor(btn){
  btn.disabled=true;btn.textContent=t("running");
  try{
    const r=await fetch("/api/doctor");const j=await r.json();
    $("doctorOut").innerHTML=j.checks.map(c=>
      `<div class="muted" style="margin-top:.5rem;direction:ltr;text-align:left">$ ${esc(c.cmd)}</div><pre class="out">${esc(c.output)}</pre>`).join("");
  }finally{btn.disabled=false;btn.textContent=t("run_diag");}
}

/* monitor */
function setMetric(btn){
  metric=btn.dataset.m;
  document.querySelectorAll("#metricSeg button").forEach(b=>b.classList.toggle("on",b===btn));
  drawChart();
}
async function loadMonitor(){
  $("chart").innerHTML=`<div class="muted">${t("loading")}</div>`;
  const r=await fetch("/api/monitor");M=await r.json();
  renderMonitor();
}
function renderMonitor(){
  if(!M)return;
  const lim=M.limits||{};
  const ses=Math.floor(lim.five_hour?.utilization??0),wk=Math.floor(lim.seven_day?.utilization??0);
  const today=M.days[M.days.length-1]||{},w=M.week||{};
  let age="";
  const ua=parseInt(lim.updated_at||0);
  if(ua){const m=Math.round((Date.now()/1000-ua)/60);
    age=m<2?t("limits_now"):t("limits_age").replace("{t}",m<60?m+"m":Math.round(m/60)+"h");}
  const ageTag=age?`<span class="tag t-manual q" data-tip="${esc(t("limits_src_tip"))}">${age}</span>`:Q("limits_src_tip");
  $("kpis").innerHTML=`
    <div class="kpi"><div class="l">${t("mon_5h")} ${Q("mon_5h_tip")} ${ageTag}</div>
      <div class="n">${ses}%</div><div class="bar"><i class="${barCls(ses)}" style="width:${ses}%"></i></div></div>
    <div class="kpi"><div class="l">${t("mon_wk")} ${Q("mon_wk_tip")} ${ageTag}</div>
      <div class="n">${wk}%</div><div class="bar"><i class="${barCls(wk)}" style="width:${wk}%"></i></div></div>
    <div class="kpi"><div class="l">${t("mon_today")} ${Q("mon_today_tip")}</div>
      <div class="n">${fmtTok(today.output)}</div><div class="l">${today.messages||0} ${t("msgs")}</div></div>
    <div class="kpi"><div class="l">${t("mon_week")} ${Q("mon_week_tip")}</div>
      <div class="n">${fmtTok(w.output)}</div><div class="l">${w.messages||0} ${t("msgs")} · ${fmtTok(w.cache)} cache</div></div>`;
  drawChart();
  const mx1=M.models[0]?.[1]||1,mx2=M.projects[0]?.[1]||1;
  $("tblModels").innerHTML=`<tr><th>${t("model_col")}</th><th>${t("msgs")}</th><th style='width:45%'></th></tr>`+
    (M.models.map(([m,c])=>`<tr><td class="cmd" style="background:none">${esc(m)}</td><td>${c}</td>
      <td><div class="bar"><i style="width:${Math.round(c/mx1*100)}%;background:var(--blue)"></i></div></td></tr>`).join("")||"<tr><td>—</td></tr>");
  $("tblProjects").innerHTML=`<tr><th>${t("proj_col")}</th><th>Output</th><th style='width:45%'></th></tr>`+
    (M.projects.map(([p,c])=>`<tr><td class="cmd" style="background:none">${esc(p)}</td><td>${fmtTok(c)}</td>
      <td><div class="bar"><i style="width:${Math.round(c/mx2*100)}%;background:var(--accent)"></i></div></td></tr>`).join("")||"<tr><td>—</td></tr>");
  const mt=M.matrix||{projects:[],models:[],cells:{}};
  $("tblMatrix").innerHTML=`<tr><th>${t("proj_col")}</th>${mt.models.map(m=>`<th class="cmd" style="background:none">${esc(m)}</th>`).join("")}</tr>`+
    (mt.projects.map(p=>`<tr><td class="cmd" style="background:none">${esc(p)}</td>
      ${mt.models.map(m=>{const v=mt.cells[p]?.[m]||0;
        return `<td style="${v?"":"color:var(--muted)"}">${v?fmtTok(v):"·"}</td>`;}).join("")}</tr>`).join("")||"<tr><td>—</td></tr>");
}
function drawChart(){
  if(!M)return;
  const days=M.days,vals=days.map(d=>d[metric]||0),mx=Math.max(...vals,1);
  const W=680,H=180,P=44,bw=Math.floor((W-P)/days.length)-14;
  const fmt=metric==="messages"?(v=>v):fmtTok;
  let grid="";
  for(let i=0;i<=3;i++){const y=H-Math.round(H*i/3);
    grid+=`<line x1="${P}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${P-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(mx*i/3))}</text>`;}
  $("chart").innerHTML=`<svg viewBox="0 -18 ${W} ${H+52}" style="width:100%;direction:ltr">
    ${grid}
    ${days.map((d,i)=>{const v=d[metric]||0,h=Math.round(v/mx*H)||1,x=P+i*(bw+14)+7;
      const last=i===days.length-1;
      return `<g><title>${d.date} · ${fmt(v)}</title>
        <rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="6"
          fill="${last?"var(--accent)":"var(--blue)"}" opacity="${last?1:.75}"/>
        <text x="${x+bw/2}" y="${H-h-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${fmt(v)}</text>
        <text x="${x+bw/2}" y="${H+18}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.date.slice(5).replace("-","/")}</text>
        <text x="${x+bw/2}" y="${H+32}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${t("dow")[new Date(d.date).getDay()]}</text></g>`;}).join("")}
  </svg>`;
}

function tick(){$("clock").textContent=t("sub")+" · "+new Date().toLocaleTimeString(L==="he"?"he-IL":"en-GB",{hour:"2-digit",minute:"2-digit"});}
buildStatic();tick();setInterval(tick,30000);
api("/api/state").then(j=>{S=j;renderAll();});
