<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Control</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#171614">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* dark palette (design 2026-10). Legacy names (--card, --ink, --code, --good, --blue, --danger)
     stay as aliases so the existing renders keep working. */
  :root {
    --bg:#171614; --surface:#211F1C; --surface-2:#2A2824; --line:#34312C;
    --text:#EDE9E3; --muted:#9C968C; --accent:#E0805A;
    --ok:#6FBF73; --warn:#E3B341; --bad:#E5645A; --info:#7AA2F7;
    --log-bg:#121110;
    --card:var(--surface); --ink:var(--text); --code:var(--surface-2);
    --good:var(--ok); --blue:var(--info); --danger:var(--bad);
    --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent);
    --good-soft:color-mix(in srgb,var(--ok) 15%,transparent);
    --blue-soft:color-mix(in srgb,var(--info) 13%,transparent);
    --warn-soft:color-mix(in srgb,var(--warn) 14%,transparent);
    --bad-soft:color-mix(in srgb,var(--bad) 14%,transparent);
    --shadow:0 1px 3px rgba(0,0,0,.35);
    --font:"Rubik",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:clip}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;
       padding:0 clamp(16px,3.4vw,48px) 4rem;overflow-x:clip;min-width:0}
  .wrap{max-width:1344px;margin:0 auto;width:100%;min-width:0}
  .narrow{max-width:1040px;margin-inline:auto}
  .ic{width:18px;height:18px;flex:none;vertical-align:middle}
  [dir="ltr"] .ic.ltr-flip,[dir="rtl"] .ic.rtl-flip{transform:scaleX(-1)}
  a{color:inherit}
  .page{display:none;min-width:0} .page.on{display:block}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);margin-bottom:1rem}
  section>.shead{display:flex;align-items:center;gap:.55rem;padding:.7rem 1.1rem;
    border-bottom:1px solid var(--line);flex-wrap:wrap;border-radius:12px 12px 0 0;
    background:color-mix(in srgb,var(--card) 70%,var(--bg))}
  section>.shead b{font-size:.92rem;letter-spacing:.01em}
  section>.sbody{padding:.85rem 1.1rem}
  .grid{display:grid;gap:.7rem}
  .g3{grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
  .g4{grid-template-columns:repeat(auto-fill,minmax(192px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:.8rem 1rem;box-shadow:var(--shadow)}
  .kpi .n{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
  .kpi .l{font-size:.73rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
  .bar{height:6px;background:var(--code);border-radius:99px;overflow:hidden;margin-top:.45rem}
  .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
  .bar i.warn{background:var(--accent)} .bar i.hot{background:var(--danger)}
  .tag{font-size:.66rem;padding:.06rem .5rem;border-radius:99px;font-weight:600;white-space:nowrap}
  .t-live{background:var(--good-soft);color:var(--good)}
  .t-next{background:var(--accent-soft);color:var(--accent)}
  .t-manual{background:var(--code);color:var(--muted)}
  .t-est{background:var(--code);color:var(--muted);font-family:ui-monospace,monospace;direction:ltr}
  .row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
    padding:.55rem 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .name{font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
  .row .hint{font-size:.74rem;color:var(--muted)}
  .q{display:inline-flex;width:15px;height:15px;border-radius:50%;background:var(--code);
    color:var(--muted);font-size:.6rem;font-weight:700;align-items:center;justify-content:center;
    cursor:help;flex:none}
  .q:hover{background:var(--ink);color:var(--bg)}
  #tip{position:fixed;background:var(--ink);color:var(--bg);padding:.45rem .7rem;border-radius:8px;
    font-size:.75rem;max-width:270px;line-height:1.5;z-index:100;display:none;
    box-shadow:0 6px 18px rgba(0,0,0,.3);pointer-events:none}
  .tg{position:relative;width:38px;height:21px;flex:none;cursor:pointer}
  .tg input{opacity:0;width:0;height:0}
  .tg span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.18s}
  .tg span::before{content:"";position:absolute;height:15px;width:15px;top:3px;inset-inline-start:3px;
    background:var(--card);border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .tg input:checked+span{background:var(--good)}
  .tg input:checked+span::before{transform:translateX(-17px)}
  [dir="ltr"] .tg input:checked+span::before{transform:translateX(17px)}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:.35rem .85rem;cursor:pointer;font-size:.83rem;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.06);color:#fff}
  button.bluebtn{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button.bluebtn:hover{filter:brightness(1.06);color:#fff}
  button.ghost{border:none;background:none;color:var(--muted);padding:.15rem .35rem}
  button.ghost:hover{color:var(--danger)}
  code,.cmd{font-family:"SF Mono",ui-monospace,Menlo,monospace;background:var(--code);
    border-radius:6px;padding:.12rem .45rem;font-size:.78em;direction:ltr;unicode-bidi:embed}
  .cmdline .cmd{display:block;overflow-x:auto;white-space:nowrap;padding:.5rem .65rem}
  .preset{background:var(--card);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:.85rem 1rem;display:flex;flex-direction:column;gap:.3rem;
    border-inline-start:4px solid var(--line)}
  .preset.k-generic{border-inline-start-color:var(--blue)}
  .preset.k-custom{border-inline-start-color:var(--good)}
  .preset .pc-head{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
  .preset .pc-tools{display:flex;gap:.15rem;align-items:center}
  .preset .d{font-size:.78rem;color:var(--muted);flex:1}
  .preset .a{display:flex;gap:.45rem;margin-top:.45rem;flex-wrap:wrap;align-items:center}
  .preset .chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.15rem}
  .divider{border:none;border-top:1px solid var(--line);margin:1.1rem 0}
  .muted{color:var(--muted);font-size:.8rem}
  .chip{font-size:.73rem;background:var(--code);border-radius:99px;padding:.14rem .6rem;direction:ltr}
  select,input[type=text],textarea{font:inherit;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:.34rem .6rem;font-size:.85rem}
  input[type=text]{width:100%}
  textarea{width:100%;min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;direction:ltr}
  .toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);border-radius:99px;padding:.5rem 1.2rem;font-size:.85rem;
    opacity:0;transition:.25s;pointer-events:none;z-index:110;box-shadow:0 4px 18px rgba(0,0,0,.3)}
  .toast.on{opacity:1}
  .overlay{position:fixed;inset:0;background:rgba(15,12,10,.5);display:none;z-index:90;
    align-items:center;justify-content:center;padding:1rem}
  .overlay.on{display:flex}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:1.25rem 1.35rem;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal h3{margin-bottom:.8rem;font-size:1.02rem;display:flex;gap:.45rem;align-items:center}
  .field{margin-bottom:.75rem}
  .field>label{display:flex;font-size:.76rem;color:var(--muted);margin-bottom:.25rem;gap:.35rem;align-items:center}
  .field .exp{font-size:.72rem;color:var(--muted);margin-top:.2rem;line-height:1.45}
  .bp{background:var(--blue-soft);border-inline-start:3px solid var(--blue);border-radius:8px;
    padding:.6rem .8rem;font-size:.76rem;line-height:1.55;margin-bottom:.8rem}
  .bp b{display:block;margin-bottom:.15rem}
  .dd{position:relative;display:inline-block}
  .ddbtn{display:inline-flex;align-items:center;gap:.5rem;min-width:160px;justify-content:space-between}
  .ddbtn::after{content:"▾";font-size:.7rem;color:var(--muted)}
  .ddpanel{position:absolute;top:calc(100% + 6px);inset-inline-start:0;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);
    padding:.45rem;min-width:250px;max-height:280px;overflow-y:auto;z-index:80;display:none}
  .dd.open .ddpanel{display:block}
  .ddpanel label{display:flex;align-items:center;gap:.55rem;padding:.34rem .5rem;border-radius:8px;
    cursor:pointer;font-size:.85rem}
  .ddpanel label:hover{background:var(--code)}
  .ddpanel .sm{font-size:.7rem;color:var(--muted);margin-inline-start:auto;direction:ltr}
  .brow{padding:.7rem 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .brow>.bt{font-size:.8rem;font-weight:600;margin-bottom:.4rem;display:flex;gap:.4rem;align-items:center;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .brow .exp{font-size:.73rem;color:var(--muted);margin-top:.3rem;line-height:1.5}
  th,td{text-align:start;padding:.42rem .6rem;border-bottom:1px solid var(--line);font-size:.85rem}
  th{color:var(--muted);font-weight:600;font-size:.73rem}
  table{width:100%;border-collapse:collapse}
  .chart{width:100%;overflow-x:auto}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:none;border-radius:0;font-size:.78rem;padding:.28rem .8rem;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .guide li{font-size:.9rem;margin-bottom:.6rem}
  .guide ol{margin:0 1.3rem .5rem}
  .guide pre{background:var(--code);border-radius:8px;padding:.55rem .8rem;direction:ltr;
    text-align:left;font-size:.8rem;overflow-x:auto;margin:.3rem 0 .2rem;
    font-family:ui-monospace,Menlo,monospace}
  pre.out{background:var(--code);border-radius:10px;padding:.7rem .9rem;direction:ltr;text-align:left;
    font-size:.76rem;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;
    max-height:280px;overflow-y:auto;margin-top:.5rem}
  /* ═══════════ layout system (2026-10-15): one panel style, aligned columns, fixed sizes ═══════════
     spacing scale 4/8/12/16/24/32 · page gap 24 · panel header 64 · buttons 38 (32 small) */
  :root{--gap:24px;--ph:64px;--r:14px;--bh:38px;--bh-sm:32px;--px:20px;--tb:80px}
  [hidden]{display:none!important}
  body{padding:0 clamp(16px,2.4vw,32px) 32px}
  .wrap{max-width:1440px}
  .g3{grid-template-columns:repeat(auto-fill,minmax(min(272px,100%),1fr))}
  .g4{grid-template-columns:repeat(auto-fill,minmax(min(192px,100%),1fr))}
  .grid>*,.row>*{min-width:0}
  .ms-auto{margin-inline-start:auto}
  .optrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chkl{display:flex;gap:6px;align-items:center;font-size:.86rem;height:var(--bh)}
  .btnrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .mono{font-family:var(--mono)}
  code,.cmd,textarea,pre.out,.guide pre{font-family:var(--mono)}
  .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .note{font-size:.74rem;color:var(--muted)}
  .tag.q{width:auto;height:auto;border-radius:99px;display:inline-flex;font-size:.66rem;padding:.06rem .5rem}

  /* buttons and inputs: one height per size */
  button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
    height:var(--bh);padding:0 14px;line-height:1;font-size:.83rem;border-radius:9px;flex:none}
  .btn{font:inherit;font-size:.83rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
    cursor:pointer;text-decoration:none;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  button.primary,.btn.primary{color:#1B1310}
  button.primary:hover,.btn.primary:hover{color:#1B1310}
  button.sm,.btn.sm{height:var(--bh-sm);padding:0 12px;font-size:.8rem;border-radius:8px}
  button:disabled{opacity:.55;cursor:default}
  button .ic,.btn .ic{width:15px;height:15px}
  button.ghost{height:28px;padding:0 6px;border:none;background:none}
  .ib{width:var(--bh);height:var(--bh);padding:0;border-radius:10px;background:transparent;color:var(--muted)}
  .ib .ic{width:17px;height:17px}
  .ib.sm{width:var(--bh-sm);height:var(--bh-sm);border-radius:8px}
  .ib:hover{color:var(--text);border-color:var(--muted)}
  .ib.danger:hover{color:var(--bad);border-color:var(--bad)}
  select,input[type=text]{height:var(--bh);padding:0 10px}
  .panel-h input[type=text],.panel-h select{height:var(--bh-sm)}
  .spin{width:13px;height:13px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;
    display:inline-block;animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted);flex:none}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
  .dot.live{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
  .c-ok{color:var(--ok)} .c-warn{color:var(--warn)} .c-bad{color:var(--bad)} .c-info{color:var(--info)} .c-muted{color:var(--muted)}

  /* page frame */
  .page.on{display:flex;flex-direction:column;gap:var(--gap)}
  .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);align-items:stretch}
  .cols.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .col>.panel:last-child{flex:1 1 auto}

  /* panel: the only boxed section style */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;
    min-width:0;overflow:hidden}
  .panel.ovf{overflow:visible}
  .panel-h{height:var(--ph);flex:none;display:flex;align-items:center;gap:12px;padding:0 var(--px);
    border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,var(--bg));
    border-radius:var(--r) var(--r) 0 0;min-width:0}
  .panel-h .ttl{flex:1 1 auto;min-width:0}
  .panel-h h2{font-size:1rem;font-weight:700;line-height:1.35;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
  .panel-h h2 .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .panel-h .sub{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;margin-top:2px}
  .panel-h .acts{display:flex;gap:8px;align-items:center;flex:none;margin-inline-start:auto}
  .panel-b{flex:1 1 auto;padding:4px var(--px);min-width:0}
  .panel-b.pad{padding:16px var(--px)}
  .panel-b.flush{padding:0}
  .panel-b.scroll{flex:1 1 0;height:0;min-height:420px;overflow-y:auto}
  .panel-f{flex:none;padding:12px var(--px);border-top:1px solid var(--line);font-size:.74rem;color:var(--muted);line-height:1.5}
  .row{min-height:60px;padding:10px 0;gap:16px}
  .row>:first-child{flex:1 1 auto;min-width:0}
  .row .name{flex-wrap:nowrap;white-space:nowrap;min-width:0}
  .row .end{display:flex;gap:8px;align-items:center;flex:none}
  .row .hint{line-height:1.45;margin-top:2px}

  /* data tables (manage, monitor) */
  table.dtable{table-layout:fixed;width:100%}
  table.dtable th{height:40px;padding:0 var(--px);background:color-mix(in srgb,var(--surface) 60%,var(--bg));font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;top:0;z-index:1}
  table.dtable td{height:44px;padding:0 var(--px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  table.dtable tr:last-child td{border-bottom:0}
  td.code,th.code{font-family:var(--mono);font-size:.8rem;direction:ltr;unicode-bidi:isolate;text-align:right}
  [dir="ltr"] td.code,[dir="ltr"] th.code{text-align:left}
  td.num{font-variant-numeric:tabular-nums}
  .cellflex{display:flex;gap:8px;align-items:center}
  .tscroll{overflow-x:auto}
  .tmsg{padding:20px var(--px);color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:10px}

  /* top bar: same on every page, fixed height */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:nowrap;height:var(--tb);padding:0;
    position:sticky;top:0;background:var(--bg);z-index:20;min-width:0}
  .tb-start{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;min-width:0;flex:1 1 auto;overflow:hidden}
  .tb-start h1{font-size:1.4rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .tb-start .sub{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .crumb{display:flex;align-items:baseline;gap:10px;font-size:1.05rem;white-space:nowrap;min-width:0}
  .crumb a{color:var(--muted);text-decoration:none;font-size:.95rem}
  .crumb a:hover{color:var(--text)}
  .crumb span{color:var(--muted)}
  .crumb b{font-size:1.35rem;font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .back{display:inline-grid;place-items:center;width:var(--bh-sm);height:var(--bh-sm);border-radius:9px;flex:none;
    color:var(--muted);border:1px solid var(--line);text-decoration:none}
  .back:hover{color:var(--text);border-color:var(--muted)}
  .tb-end{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:nowrap;flex:none}
  .tb-status{font-size:.78rem;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .tb-status.err{color:var(--bad)}
  #tbExtra:empty{display:none}

  /* home: health hero */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 28px;
    display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .hero.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
  .hero.warn{border-color:color-mix(in srgb,var(--warn) 75%,var(--line))}
  .hero.bad{border-color:color-mix(in srgb,var(--bad) 75%,var(--line))}
  .hero-main{flex:1 1 520px;min-width:0}
  .hl{font-size:1.55rem;font-weight:700;display:flex;align-items:center;gap:12px;letter-spacing:-.01em;min-width:0}
  .hl .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hl .dot{width:11px;height:11px}
  .hsub{color:var(--muted);font-size:.86rem;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pill{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;background:var(--surface-2);height:30px;
    border:1px solid var(--line);border-radius:99px;padding:0 12px;white-space:nowrap;max-width:100%;
    overflow:hidden;text-overflow:ellipsis}
  .pill .ic{width:15px;height:15px}
  .pill.ok .ic{color:var(--ok)} .pill.warn .ic{color:var(--warn)} .pill.bad .ic{color:var(--bad)} .pill.info .ic{color:var(--info)}
  .hero-acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .hero-acts button,.hero-acts .btn{height:42px;padding:0 18px;font-size:.9rem;border-radius:10px}
  .running{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--info);margin-top:8px}
  .errline{display:flex;align-items:center;gap:10px;color:var(--bad);font-weight:600;flex-wrap:wrap}
  .errline .ic{color:var(--bad)}
  .errline button{font-weight:400}
  .label{color:var(--muted);font-size:.9rem;margin:0;line-height:1.4}

  /* home: cards (equal heights) */

  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .ibox{width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--text)}

  .card .stat{font-size:.8rem;display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;height:32px;white-space:nowrap;overflow:hidden}
  .card.warn{border-color:color-mix(in srgb,var(--warn) 75%,var(--line));background:color-mix(in srgb,var(--warn) 4%,var(--surface))}
  .card.warn .ibox{background:var(--warn-soft);color:var(--warn)}
  .card.warn .stat{color:var(--warn)}
  .card.bad .stat{color:var(--bad)}

  /* sessions page */
  #banners{display:flex;flex-direction:column;gap:12px}
  #banners:empty{display:none}
  .banner{border:1px solid color-mix(in srgb,var(--warn) 80%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));
    border-radius:var(--r);padding:12px 20px;min-height:var(--ph);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .banner.bad{border-color:color-mix(in srgb,var(--bad) 80%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
  .banner .bn-txt{flex:1 1 360px;min-width:0}
  .banner b{color:var(--warn);font-size:.95rem}
  .banner .muted{font-size:.8rem;margin-top:2px}
  .bn-act{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:nowrap}
  .monobox{font-family:var(--mono);font-size:.8rem;background:#0E0D0C;border-radius:8px;padding:0 12px;height:var(--bh);line-height:var(--bh);direction:ltr;
    unicode-bidi:isolate;max-width:min(320px,60vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;
    text-decoration:none;color:var(--text)}
  a.monobox:hover{color:var(--accent)}
  .ses-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:var(--gap);align-items:stretch}
  table.stable{table-layout:fixed;width:100%}
  table.stable col.c-st{width:190px} table.stable col.c-rc{width:180px}
  table.stable col.c-last{width:120px} table.stable col.c-act{width:252px}
  table.stable th{height:40px;background:color-mix(in srgb,var(--surface) 60%,var(--bg));padding:0 16px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.stable td{height:56px;padding:0 16px;font-size:.85rem;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.stable th:first-child,table.stable td:first-child{padding-inline-start:var(--px)}
  table.stable tr:last-child td{border-bottom:0}
  table.stable tr.hot td{background:color-mix(in srgb,var(--bad) 5%,transparent)}
  table.stable td.nm{font-family:var(--mono);font-size:.86rem;direction:ltr;text-align:right;unicode-bidi:isolate}
  [dir="ltr"] table.stable td.nm{text-align:left}
  .st,.rcs{display:flex;align-items:center;gap:8px;min-width:0}
  .st .tx,.rcs .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .st.warn{color:var(--warn)} .st.muted{color:var(--muted)}
  .rcs .ic{width:15px;height:15px}
  .rcs.ok{color:var(--ok)} .rcs.bad{color:var(--bad)} .rcs.muted{color:var(--muted)}
  .acts-cell{display:flex;gap:8px;align-items:center;justify-content:flex-start}
  .acts-cell .pri{min-width:126px}
  /* system checks: compact rows in one panel */
  .chk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;
    padding:12px var(--px);border-bottom:1px solid var(--line);min-height:62px}
  .chk:last-child{border-bottom:0}
  .chk>.ic{width:16px;height:16px;color:var(--muted)}
  .chk.ok>.ic{color:var(--ok)} .chk.warn>.ic{color:var(--warn)} .chk.bad>.ic{color:var(--bad)} .chk.info>.ic{color:var(--info)}
  .chk.warn{background:color-mix(in srgb,var(--warn) 6%,transparent)}
  .chk.bad{background:color-mix(in srgb,var(--bad) 6%,transparent)}
  .chk>b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .chk .d,.chk .a{grid-column:2/4}
  .chk .d{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .chk .a{margin-top:6px;display:flex;gap:8px}
  .chk .tmsg,.chk .errline{grid-column:1/4;padding:0}
  .lv{font-size:.7rem;height:22px;display:inline-flex;align-items:center;padding:0 9px;border-radius:99px;white-space:nowrap}
  .lv.ok{background:var(--good-soft);color:var(--ok)} .lv.warn{background:var(--warn-soft);color:var(--warn)}
  .lv.bad{background:var(--bad-soft);color:var(--bad)} .lv.info{background:var(--blue-soft);color:var(--info)}

  /* log viewer: fixed 320px on #/sessions, remaining viewport on #/logs */
  .logs .panel-h .ttl{flex:none}

  .ltabs button.on{background:var(--surface-2);color:var(--text)}
  .logs-tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex:none}
  .logs-tools input[type=text]{width:200px;background:var(--log-bg);border-color:var(--log-bg)}
  .logbody{background:var(--log-bg);font-family:var(--mono);font-size:.79rem;line-height:1.75;padding:12px 20px;
    height:320px;flex:none;overflow:auto;direction:ltr;text-align:left;border-radius:0 0 var(--r) var(--r)}
  #page-logs.on{height:calc(100vh - var(--tb) - 32px);min-height:420px}
  #slotLogPage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .logs.full{flex:1 1 auto;min-height:0}
  .logs.full .logbody{flex:1 1 0;height:auto;min-height:200px}
  .ll{white-space:pre-wrap;word-break:break-word}
  .ll .ts{color:var(--muted);margin-right:14px}
  .ll .src{color:var(--muted);margin-right:10px;opacity:.8}
  .ll.bad .m{color:var(--bad)} .ll.warn .m{color:var(--warn)} .ll.ok .m{color:var(--ok)} .ll.info .m{color:var(--text)}
  .logbody .tmsg{padding:6px 0}
  .logbody .errline{font-family:var(--font);margin-bottom:8px}

  /* new session page */
  .presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));grid-auto-rows:1fr;gap:16px}
  .preset{background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--line);border-radius:12px;
    box-shadow:none;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:188px;min-width:0;
    border-inline-start:4px solid var(--line)}
  .preset .pc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;height:28px}
  .preset .pc-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .preset .pc-tools{display:flex;gap:2px;align-items:center;flex:none}
  .preset .d{font-size:.78rem;color:var(--muted);flex:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
  .preset .a{display:flex;gap:8px;margin-top:auto;flex-wrap:nowrap;align-items:center}
  .preset .chips{display:flex;gap:4px;flex-wrap:wrap}
  .chip{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .empty{color:var(--muted);font-size:.85rem;padding:4px 0}
  .brow{padding:16px 0;border-bottom:1px solid var(--line)}
  .brow:last-child{border-bottom:0}
  .brow>.bt{font-size:.74rem;font-weight:600;margin-bottom:8px;display:flex;gap:6px;align-items:center;
    color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .brow .exp{font-size:.73rem;color:var(--muted);margin-top:8px;line-height:1.5}
  .cwd{flex:1 1 260px;width:auto!important;min-width:0}
  #cModel{flex:0 1 220px;min-width:0}
  .cmdline .cmd{display:block;white-space:pre-wrap;word-break:break-all;padding:9px 12px;line-height:1.5;min-height:var(--bh)}

  /* manage + monitor */
  .field-inline{display:flex;gap:8px;margin-top:8px;max-width:480px}
  .field-inline input{flex:1 1 auto;min-width:0}
  .settings-sel{width:220px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:var(--gap)}
  .kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .setup p{font-size:.86rem;line-height:1.6;margin:0 0 12px}
  .setup ol{margin:0 0 12px;padding-inline-start:20px;display:grid;gap:12px;font-size:.86rem}
  .setup li .bn-act{margin-top:6px}
  .setup .note{margin:0}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px var(--px);box-shadow:none;
    display:flex;flex-direction:column;gap:4px;min-height:116px;min-width:0}
  .kpi .l{white-space:nowrap;overflow:hidden;min-width:0}
  .kpi .n{margin-top:auto}
  #chart{position:relative;min-height:280px;padding:0}

  #chart>.tmsg{position:absolute;inset:0;align-items:flex-start}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;height:var(--bh-sm)}
  .seg button{border:none;border-radius:0;font-size:.78rem;height:100%;padding:0 12px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .guide{max-width:880px}

  /* popover menu, toast variants, modals */
  #menuPop{position:fixed;z-index:95;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:5px;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none}
  #menuPop.on{display:block}
  #menuPop button{display:flex;width:100%;justify-content:flex-start;border:none;background:none;height:36px;padding:0 12px;font-size:.84rem}
  #menuPop button:hover{background:var(--surface);color:var(--text)}
  #menuPop button.danger:hover{color:var(--bad)}
  .toast.ok{background:var(--ok);color:#10200F}
  .toast.bad{background:var(--bad);color:#fff}
  .qrwrap{background:#fff;padding:10px;border-radius:12px;width:200px}

  .linkrow{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:nowrap}

  .mhead{margin-bottom:12px}
  .mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .centered{display:flex;justify-content:center;margin:8px 0}

  /* session search (2026-10-15): top bar box, #/search page, fallen panel on #/sessions */
  .tb-search{position:relative;display:flex;align-items:center;width:220px;flex:none;margin:0}
  .tb-search .ic{position:absolute;inset-inline-start:11px;width:15px;height:15px;color:var(--muted);pointer-events:none}
  .tb-search input[type=text]{height:var(--bh);padding-inline-start:34px;border-radius:10px;background:var(--surface)}
  .sr-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px var(--px);border-bottom:1px solid var(--line)}
  .sr-q{position:relative;flex:1 1 360px;min-width:0;display:flex;align-items:center}
  .sr-q>.ic{position:absolute;inset-inline-start:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
  .sr-q input[type=text]{height:46px;font-size:1rem;padding-inline:44px;border-radius:10px;background:var(--bg)}
  .sr-q>.spin{position:absolute;inset-inline-end:16px;color:var(--muted)}
  .sr-opt{display:flex;gap:12px;align-items:center;flex:none;min-width:0}
  .sr-tgl{display:flex;gap:8px;align-items:center;font-size:.85rem;height:var(--bh);cursor:pointer;white-space:nowrap}
  .sr-chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px var(--px);border-bottom:1px solid var(--line)}
  .fchip{height:var(--bh-sm);padding:0 12px;border-radius:99px;font-size:.8rem;color:var(--muted);background:transparent}
  .fchip b{font-weight:600;font-size:.72rem;background:var(--surface-2);border-radius:99px;padding:2px 8px;color:var(--text);
    font-variant-numeric:tabular-nums;min-width:24px;text-align:center}
  .fchip.on,.fchip.on:hover{background:var(--text);color:var(--bg);border-color:var(--text)}
  .fchip.on b{background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
  table.srtable col.c-where{width:300px} table.srtable col.c-dir{width:180px}
  table.srtable col.c-when{width:120px} table.srtable col.c-sact{width:224px} table.srtable col.c-fact{width:150px}
  table.srtable td{height:64px}
  table.srtable.ftable td{height:52px}
  table.srtable.busy tbody{opacity:.5;transition:opacity .15s}
  .t2{display:flex;flex-direction:column;gap:2px;min-width:0}
  .t2>div{display:flex;gap:8px;align-items:center;min-width:0}
  .t2 .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .t2 .l1{font-weight:500}
  .t2 .l2{font-size:.76rem;color:var(--muted)}
  .t2 .lv{flex:none}
  .acts-cell .ib:last-child{margin-inline-start:auto}
  .rs-what{background:var(--surface-2);border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
  .rs-what b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rs-what .mono{font-size:.76rem;color:var(--muted);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  @media (max-width:1100px){
    .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ses-grid,.cols,.cols.wide{grid-template-columns:minmax(0,1fr)}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .logs-tools .lbl{display:none}
    .logs-tools input[type=text]{width:160px}
  }
  @media (max-width:1000px){
    table.stable col.c-st{width:130px} table.stable col.c-rc{width:130px} table.stable col.c-last{width:100px} table.stable col.c-act{width:246px}
    table.stable th,table.stable td{padding:0 12px}
    table.srtable col.c-where{width:196px} table.srtable col.c-dir{width:110px}
    table.srtable col.c-when{width:92px} table.srtable col.c-sact{width:216px}
    .tb-search{width:170px}
  }
  @media (max-width:640px){
    .cards,.kpis{grid-template-columns:minmax(0,1fr)}
    .panel-h{height:auto;min-height:var(--ph);flex-wrap:wrap;padding:12px 16px}

    .logs-tools input[type=text]{width:140px}
    .hl{font-size:1.25rem}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar" id="topbar">
    <div class="tb-start" id="tbStart"></div>
    <div class="tb-end">
      <label class="tb-search" id="tbSearch"><span id="tbSearchIc"></span>
        <input type="text" id="tbQ" dir="auto" autocomplete="off" spellcheck="false" onkeydown="tbSearchKey(event)"></label>
      <span class="tb-status" id="tbStatus"></span>
      <span id="tbExtra"></span>
      <button class="ib" id="langBtn" onclick="setLang(L==='he'?'en':'he')"></button>
      <button class="ib" id="refreshBtn" onclick="refreshAll(this)"></button>
      <button class="ib danger" id="powerBtn" onclick="shutdown()"></button>
    </div>
  </header>
  <main id="content"></main>
</div>

<div id="tip"></div>
<div class="toast" id="toast"></div>
<div id="menuPop" role="menu"></div>
<div id="modals"></div>

const toast=(m,kind)=>{const x=$("toast");x.textContent=m;x.className="toast on"+(kind?" "+kind:"");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove("on"),kind==="bad"?4200:2600);};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTok=n=>{n=n||0;return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?Math.round(n/1e3)+"K":n>=1e3?(n/1e3).toFixed(1)+"K":""+n;};

const PH=(title,tip="",acts="",subId="")=>`<div class="panel-h"><div class="ttl"><h2><span class="tx">${title}</span>${tip?Q(tip):""}</h2>`
  +`${subId?`<div class="sub" id="${subId}"></div>`:""}</div>${acts?`<div class="acts">${acts}</div>`:""}</div>`;

document.addEventListener("mouseover",e=>{
  const q=e.target.closest("[data-tip]");const tip=$("tip");
  if(!q){tip.style.display="none";return;}
  tip.textContent=q.dataset.tip||"";tip.style.display="block";
  const r=q.getBoundingClientRect(),tw=tip.offsetWidth;
  let x=r.left+r.width/2-tw/2;x=Math.max(8,Math.min(x,innerWidth-tw-8));
  tip.style.left=x+"px";
  tip.style.top=(r.bottom+8+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-8:r.bottom+8)+"px";
});

// every API call carries the UI language: server messages, check titles and issues come back in it
const lq=u=>u+(u.includes("?")?"&":"?")+"lang="+L;
const lb=b=>JSON.stringify({...(b||{}),lang:L});
// optional parts of this machine (server: features). Unknown yet = assume present.
function F(k){const f=(RC&&RC.features)||(S&&S.features);return f?f[k]!==false:true;}
async function api(path,body){
  const r=await fetch(body?path:lq(path),body?{method:"POST",body:lb(body)}:{});
  const j=await r.json();
  if(j.error){toast(t("err")+j.error);throw j.error;}
  if(j.state){S=j.state;renderAll();}
  return j;
}
function setLang(l){
  L=l;localStorage.setItem("cc-lang",l);
  document.documentElement.lang=l;
  buildStatic();renderAll();route(true);
  renderRc();renderLogs(true);
  if(activeTab==="monitor"&&M)renderMonitor();
  loadRc();api("/api/state").catch(()=>{});      // server texts in the new language
}
async function refreshAll(btn){
  btn.style.opacity=".4";
  try{
    loadRc();if(activeTab==="logs"||activeTab==="sessions")loadLogs(true);
    const s=await fetch(lq("/api/state")).then(r=>r.json());S=s;renderAll();
    if(activeTab==="monitor"||M){M=await fetch("/api/monitor?force=1").then(r=>r.json());
      if(activeTab==="monitor")renderMonitor();}
    toast(t("refreshed"));
  }catch(e){toast(t("no_server"),"bad");}
  finally{btn.style.opacity="";}
}

function showRemote(tmuxTarget){
  const R=S.remote||{},ses=(tmuxTarget||"").split(":")[0];
  // QR carries the FULL connect command as plain text: phone scanners hand it
  // to the clipboard reliably (ssh:// URIs open as dead text on many devices)
  const connectCmd=`ssh -t ${R.user}@${R.ip} "tmux attach -t ${ses}"`;
  $("remoteSteps").innerHTML=t("remote_steps")
    +`<br>${t("qr_alt").replace("{ip}",R.ip).replace("{user}",R.user)}`;
  $("remoteCmds").textContent=connectCmd;
  if(R.qr&&R.ip){
    fetch("/api/qr?text="+encodeURIComponent(connectCmd)).then(r=>r.ok?r.text():"").then(svg=>{
      $("qrBox").innerHTML=svg?`<div style="background:#fff;padding:10px;border-radius:12px;width:190px">${svg.replace(/<svg /,'<svg style="width:100%;height:auto" ')}</div>`:"";
    });
  }else{
    $("qrBox").innerHTML=`<div class="muted">${esc(t("qr_missing"))}</div>`;
  }
  $("ovRemote").classList.add("on");
}
function shutdown(){
  if(!confirm(t("confirm_off")))return;
  fetch("/api/shutdown",{method:"POST",body:"{}"}).finally(()=>{
    document.body.innerHTML=`<main style="text-align:center;padding-top:18vh;font-family:inherit">
      <h1 style="font-size:1.3rem">${t("off_t")}</h1>
      <p style="color:var(--muted);margin-top:.6rem">${t("off_h")} <code>python3 ~/.claude/dashboard/server.py</code></p></main>`;
  });
}
function toggleDd(e,id){e.stopPropagation();
  document.querySelectorAll(".dd").forEach(d=>{if(d.id!==id)d.classList.remove("open");});
  $(id).classList.toggle("open");}
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))
  document.querySelectorAll(".dd").forEach(d=>d.classList.remove("open"));});

/* ═══════════ routing (location.hash) ═══════════ */
const PAGES=["home","sessions","search","new","logs","monitor","manage","guide"];
const HOME_CARDS=[["sessions","activity"],["search","search"],["new","plus"],["logs","file"],["monitor","chart"],["manage","sliders"],["guide","book"]];
const href=p=>p==="home"?"#/":"#/"+(p==="new"?"new-session":p);
function pageFromHash(){
  const h=(location.hash||"").replace(/^#\/?/,"").split(/[?/]/)[0];
  const p=h==="new-session"?"new":h;
  return PAGES.includes(p)?p:"home";
}
function route(keepScroll){
  const prev=activeTab;activeTab=pageFromHash();
  for(const p of PAGES){const el=$("page-"+p);if(el)el.classList.toggle("on",p===activeTab);}
  const lv=$("logViewer"),slot=activeTab==="logs"?$("slotLogPage"):$("slotLogSes");
  if(lv&&slot&&lv.parentNode!==slot)slot.appendChild(lv);
  if(lv)lv.classList.toggle("full",activeTab==="logs");
  hideMenu();renderTopbar();
  document.title=activeTab==="home"?"Claude Control":`${t("pg_"+activeTab)} · Claude Control`;
  if(prev!==activeTab&&!keepScroll)window.scrollTo(0,0);
  if(activeTab==="monitor")loadMonitor();
  if(activeTab==="search")initSearch();
  if(activeTab==="sessions")renderFallen();
  pollNow();
}
window.addEventListener("hashchange",()=>route());

function machineLine(){
  const cd=(S&&S.config&&S.config.code_dir)||"";
  const base=cd.replace(/\/+$/,"").split("/").pop();
  return `${t("machine")}: ${(S&&(S.machine||S.hostname))||"Mac"}${base?" · "+base:""}`;
}
function renderTopbar(){
  const home=activeTab==="home";

  $("tbSearch").hidden=activeTab==="search";   // the page has its own big search box
  renderTopStatus();
}
function renderTopStatus(){
  const el=$("tbStatus");if(!el)return;
  const p=activeTab;
  if((p==="home"||p==="sessions")&&rcErr){
    el.className="tb-status err";el.innerHTML=`${ic("bad")} ${t("no_server")}`;return;}
  el.className="tb-status";
  if(p==="home")el.textContent=rcTs?t("upd_ago").replace("{n}",Math.max(0,Math.round((Date.now()-rcTs)/1000))):"";
  else if(p==="sessions"||p==="logs")el.innerHTML=`<span class="dot ok live"></span>${t("live_5s")}`;
  else el.textContent="";
}

const arr=x=>Array.isArray(x)?x:[];

const manualIssues=()=>issues().filter(i=>i&&i.fix&&i.fix.kind==="manual");
const safeUrl=u=>/^https?:\/\//i.test(String(u||""))?String(u):"#";
const attachCmd=name=>`tmux attach -t ${(RC&&RC.rc_session)||"rc-resume"} \\; select-window -t ${name}`;
const findSes=name=>sessions().find(s=>s.name===name);
function toMs(v){
  if(v==null||v==="")return null;
  if(typeof v==="number")return v<1e12?v*1000:v;
  const s=String(v).trim();
  if(/^\d+(\.\d+)?$/.test(s)){const n=+s;return n<1e12?n*1000:n;}
  const hm=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if(hm){const d=new Date();d.setHours(+hm[1],+hm[2],+(hm[3]||0),0);
    let ms=d.getTime();if(ms>Date.now()+60000)ms-=864e5;return ms;}
  const d=Date.parse(s);return isNaN(d)?null:d;
}
function rel(v){
  const ms=toMs(v);if(ms==null)return v?String(v):"—";
  const s=Math.max(0,Math.round((Date.now()-ms)/1000));
  if(s<45)return t("rel_now");
  const m=Math.round(s/60);if(m<60)return t("rel_m").replace("{n}",m);
  const h=Math.round(m/60);if(h<24)return h===1?t("rel_h1"):t("rel_h").replace("{n}",h);
  const d=Math.round(h/24);return d===1?t("rel_d1"):t("rel_d").replace("{n}",d);
}
function fmtTs(v){
  if(typeof v==="string"&&/^\d{1,2}:\d{2}(:\d{2})?$/.test(v.trim()))return v.trim();
  const ms=toMs(v);if(ms==null)return v?String(v):"";
  return new Date(ms).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
// write innerHTML only when it changed: polling keeps hover, focus and text selection
function setHtml(el,html){if(el&&el._h!==html){el.innerHTML=html;el._h=html;}}
function errLine(retry){
  return `<div class="errline">${ic("bad")} ${t("no_server")}
    <button class="sm" onclick="${retry}">${ic("refresh")} ${t("retry")}</button></div>`;
}
function setBusy(btn,on){
  if(!btn||btn.tagName!=="BUTTON")return;
  if(on){btn.dataset.html=btn.innerHTML;btn.disabled=true;
    btn.innerHTML=`<span class="spin"></span>`+btn.innerHTML.replace(/<svg[\s\S]*?<\/svg>/,"");}
  else if(btn.dataset.html!=null){btn.innerHTML=btn.dataset.html;delete btn.dataset.html;btn.disabled=false;}
}
async function copyText(text,btn,toastKey){
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok){
    const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
    ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand("copy");}catch(e){}
    ta.remove();
  }
  if(!ok){toast(t("failed"),"bad");return;}
  const lbl=btn&&btn.querySelector("span:not(.spin)");
  if(lbl){const old=lbl.textContent;lbl.textContent=t("copied_short");setTimeout(()=>{lbl.textContent=old;},1500);}
  if(toastKey||!lbl)toast(t(toastKey||"copied"));
}

/* ═══════════ confirm + menu ═══════════ */
let confirmResolve=null;
function askConfirm(msg){
  $("cfMsg").textContent=msg;$("ovConfirm").classList.add("on");setTimeout(()=>$("cfYes").focus(),30);
  return new Promise(r=>{confirmResolve=r;});
}
function closeConfirm(v){$("ovConfirm").classList.remove("on");if(confirmResolve){confirmResolve(v);confirmResolve=null;}}
function showMenu(btn){
  const m=$("menuPop"),name=btn.dataset.menu;
  if(m.classList.contains("on")&&m.dataset.for===name){hideMenu();return;}
  m.dataset.for=name;
  m.innerHTML=`<button data-act="restart_session" data-name="${esc(name)}" data-confirm="confirm_restart">${ic("refresh")} ${t("restart")}</button>
    <button class="danger" data-act="drop" data-name="${esc(name)}" data-confirm="confirm_drop">${ic("bad")} ${t("drop")}</button>`;
  m.classList.add("on");
  const r=btn.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  let x=L==="he"?r.left:r.right-w;x=Math.max(8,Math.min(x,innerWidth-w-8));
  const y=r.bottom+6+h>innerHeight?r.top-h-6:r.bottom+6;
  m.style.left=x+"px";m.style.top=y+"px";
}
function hideMenu(){const m=$("menuPop");if(m){m.classList.remove("on");m.dataset.for="";}}
window.addEventListener("scroll",hideMenu,true);
window.addEventListener("resize",hideMenu);
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  hideMenu();
  if($("ovConfirm")?.classList.contains("on")){closeConfirm(false);return;}
  document.querySelectorAll(".overlay.on").forEach(o=>closeOv(o.id));
});
document.addEventListener("click",e=>{
  $("tip").style.display="none";
  const c=e.target.closest("[data-copy]");
  if(c){e.preventDefault();copyText(c.dataset.copy,c,c.dataset.toast);if(c.closest("#menuPop"))hideMenu();return;}
  const rs=e.target.closest("[data-resume]");
  if(rs){e.preventDefault();hideMenu();openResume(rs.dataset.resume);return;}
  const sm=e.target.closest("[data-smenu]");
  if(sm){e.preventDefault();showSrMenu(sm);return;}
  const a=e.target.closest("[data-act]");
  if(a){e.preventDefault();hideMenu();
    const body={action:a.dataset.act};
    if(a.dataset.name){body.name=a.dataset.name;const s=findSes(a.dataset.name);
      if(s){if(s.uuid)body.uuid=s.uuid;if(s.dir)body.dir=s.dir;}}
    rcAct(body,a,a.dataset.confirm);return;}
  const m=e.target.closest("[data-menu]");
  if(m){e.preventDefault();showMenu(m);return;}
  if(!e.target.closest("#menuPop"))hideMenu();
});

let RC=null,rcErr=false,rcTs=0,rcBusy=false,logStat=null;
async function loadRc(){
  if(rcBusy)return;rcBusy=true;
  try{
    const r=await fetch(lq("/api/rc/status"),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(!j||typeof j!=="object")throw new Error("bad json");
    RC=j;rcErr=false;rcTs=Date.now();
  }catch(e){rcErr=true;}
  finally{rcBusy=false;}
  renderRc();
}
function renderRc(){renderHero();renderCards();renderSessions();renderTopStatus();}
async function rcAct(body,btn,confirmKey){
  if(confirmKey&&!(await askConfirm(t(confirmKey).replace("{n}",body.name||""))))return;
  setBusy(btn,true);
  try{
    const r=await fetch("/api/rc/action",{method:"POST",body:lb(body)});
    const j=await r.json().catch(()=>({}));
    const ok=r.ok&&j.ok!==false&&!j.error;
    const failed=arr(j.results).filter(x=>x&&x.ok===false).map(x=>x.step+(x.detail?": "+x.detail:""));
    toast((j.message||j.error||(ok?t("done"):t("failed")))+(failed.length&&ok?" · "+failed[0]:""),ok?"ok":"bad");
  }catch(e){toast(t("no_server"),"bad");}
  finally{setBusy(btn,false);loadRc();setTimeout(loadRc,1500);}
}

/* ═══════════ session search (#/search) + "fell recently" (#/sessions) ═══════════ */
const SR_DAYS=[1,3,7,14,30,90];
const SR_FILTERS=[["all",()=>true],["running",r=>r.running],["fallen",r=>r.fallen],["list",r=>r.in_list],["stopped",r=>!r.running]];
const SR={q:"",content:false,days:14,filter:"all",res:null,scanned:0,err:false,busy:false,busyContent:false,seq:0,ran:""};
const SRMAP={};                 // uuid -> last seen search record (menu, resume modal)
let srTimer=null,FALLEN=null,fallenBusy=false;
const FALLEN_MAX=4;            // keep the panel compact: the rest is one click away in #/search
let resumeDry=false;            // dev switch: true sends dry:true (nothing starts). Set it from the console to test.
const srKey=()=>JSON.stringify([SR.q,SR.content&&!!SR.q,SR.days]);
function hashParams(){const h=location.hash||"",i=h.indexOf("?");return new URLSearchParams(i<0?"":h.slice(i+1));}
function searchHref(q,f){const p=new URLSearchParams();if(q)p.set("q",q);if(f&&f!=="all")p.set("f",f);
  const s=p.toString();return "#/search"+(s?"?"+s:"");}
function tbSearchKey(e){
  if(e.key!=="Enter"||e.isComposing)return;
  const v=e.target.value.trim(),h=searchHref(v);
  e.target.value="";e.target.blur();
  if(location.hash===h)route();else location.hash=h;
}
function initSearch(){
  const p=hashParams();
  SR.q=(p.get("q")||"").trim();
  const f=p.get("f");if(f&&SR_FILTERS.some(x=>x[0]===f))SR.filter=f;else if(!f&&p.has("q"))SR.filter="all";
  const i=$("srQ");if(i)i.value=SR.q;
  if($("srContent"))$("srContent").checked=SR.content;
  if($("srDays"))$("srDays").value=String(SR.days);
  if(SR.res&&SR.ran===srKey())renderSearch();else runSearch();
  setTimeout(()=>{const x=$("srQ");if(x&&activeTab==="search"){x.focus();x.setSelectionRange(x.value.length,x.value.length);}},30);
}
function setSrHash(){const h=searchHref(SR.q,SR.filter);if(location.hash!==h)history.replaceState(null,"",h);}
async function runSearch(){
  clearTimeout(srTimer);
  const seq=++SR.seq,key=srKey(),content=SR.content&&!!SR.q;
  SR.busy=true;SR.busyContent=content;renderSearch();
  try{
    const r=await fetch(lq(`/api/sessions/search?q=${encodeURIComponent(SR.q)}&days=${SR.days}&limit=300${content?"&content=1":""}`),{cache:"no-store"});
    const j=await r.json();
    if(seq!==SR.seq)return;                     // a newer search is running
    if(!r.ok||j.error)throw new Error(j.error||r.status);
    SR.res=arr(j.results);SR.scanned=j.scanned||0;SR.err=false;SR.ran=key;
    SR.res.forEach(x=>{if(x&&x.uuid)SRMAP[x.uuid]=x;});
  }catch(e){if(seq!==SR.seq)return;SR.err=true;}
  SR.busy=false;renderSearch();
}
function onSrInput(v){
  SR.q=v.trim();setSrHash();clearTimeout(srTimer);
  // content search is slow: with the switch on it waits for Enter (an empty box still lists recent sessions)
  if(SR.content&&SR.q)renderSearch();else srTimer=setTimeout(runSearch,300);
}
function onSrKey(e){if(e.key==="Enter"&&!e.isComposing){e.preventDefault();SR.q=e.target.value.trim();setSrHash();runSearch();}}
function onSrContent(on){SR.content=on;if(SR.q)runSearch();else renderSearch();}
function onSrDays(v){SR.days=+v||14;runSearch();}
function setSrFilter(f){SR.filter=f;setSrHash();renderSearch();}
function srContentOn(){SR.content=true;const c=$("srContent");if(c)c.checked=true;runSearch();}

const shq=s=>/^[A-Za-z0-9_\/.~@%+=:,-]+$/.test(s)?s:"'"+String(s).replace(/'/g,"'\\''")+"'";
function shortDir(d){
  d=String(d||"").replace(/^\/Users\/[^/]+(?=\/|$)/,"~");
  const p=d.split("/");return p.length>4?"…/"+p.slice(-2).join("/"):d;
}
function whereInfo(r){
  if(!r.running)return {kind:"none"};
  const w=String(r.where||"");
  if(w==="Claude Desktop")return {kind:"desktop",label:"Claude Desktop"};
  const m=w.match(/^([^:]+):(.+)$/);
  if(m)return {kind:"tmux",ses:m[1],win:m[2],label:`tmux: ${m[1]} / ${m[2]}`,
    cmd:`tmux attach -t ${shq(m[1])} \\; select-window -t ${shq(m[2])}`};
  return {kind:"unknown",label:w||t("running_unknown")};
}
const resumeCmd=r=>`cd ${shq(r.dir||"~")} && claude --resume ${r.uuid}`;
function fullTs(v){const ms=toMs(v);return ms==null?"":new Date(ms).toLocaleString(L==="he"?"he-IL":"en-GB",
  {day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function titleCell(r,showMatch,one){
  const name=r.title||r.first||t("untitled"),second=!one&&r.title&&r.first?r.first:"";
  return `<div class="t2"><div class="l1"><span class="tx" dir="auto" title="${esc(name)}">${esc(name)}</span>
    ${showMatch&&r.match==="content"?`<span class="lv info">${t("in_content")}</span>`:""}</div>
    ${second?`<div class="l2"><span class="tx" dir="auto" title="${esc(second)}">${esc(second)}</span></div>`:""}</div>`;
}
const dirCell=r=>`<td class="code c-muted" title="${esc(r.dir||"")}">${esc(shortDir(r.dir))}</td>`;
const whenCell=r=>`<td class="c-muted" title="${esc(fullTs(r.last_activity))}">${esc(rel(r.last_activity))}</td>`;
const resumeBtn=r=>F("restore")?`<button class="primary sm" data-resume="${esc(r.uuid)}">${ic("play")} ${t("resume_btn")}</button>`
  :`<button class="sm" data-copy="${esc(resumeCmd(r))}" data-toast="copied" data-tip="${esc(resumeCmd(r))}">${ic("term")} <span>${t("copy_resume_btn")}</span></button>`;
function srRow(r){
  const wi=whereInfo(r);
  let w1;
  if(wi.kind==="none")w1=r.fallen
    ?`<span class="lv warn">${t("fallen_pill")}</span><span class="tx c-muted">${t("not_running")}</span>`
    :`<span class="dot"></span><span class="tx c-muted">${t("not_running")}</span>`;
  else w1=`<span class="dot ok live"></span><span class="tx" dir="ltr" title="${esc(wi.label)}">${esc(wi.label)}</span>`;
  const w2=r.in_list?`<div class="l2"><span class="tx" title="${esc(t("in_list_l").replace("{n}",r.list_name||""))}">${esc(t("in_list_l").replace("{n}",r.list_name||""))}</span></div>`:"";
  let act;
  if(wi.kind==="tmux")act=`<button class="sm" data-copy="${esc(wi.cmd)}" data-toast="attach_copied" data-tip="${esc(wi.cmd)}">${ic("term")} <span>${t("copy_attach_btn")}</span></button>`;
  else if(wi.kind==="desktop")act=`<span class="c-muted trunc">${t("in_app")}</span>`;
  else if(wi.kind==="unknown")act=`<span class="c-muted trunc">${t("running_l")}</span>`;
  else act=resumeBtn(r);
  return `<tr class="${r.fallen?"hot":""}"><td>${titleCell(r,true)}</td>
    <td><div class="t2"><div class="l1">${w1}</div>${w2}</div></td>
    ${dirCell(r)}${whenCell(r)}
    <td><div class="acts-cell">${act}
      <button class="ib sm" data-smenu="${esc(r.uuid)}" data-tip="${esc(t("more"))}" aria-label="${esc(t("more"))}">${ic("more")}</button></div></td></tr>`;
}
const srMsg=(html,cols=5)=>`<tr><td colspan="${cols}"><div class="tmsg">${html}</div></td></tr>`;
function renderSearch(){
  const body=$("srBody");if(!body)return;
  const res=SR.res,ranQ=res?JSON.parse(SR.ran||'[""]')[0]:"",ranContent=res?JSON.parse(SR.ran||"[0,0]")[1]:false;
  setHtml($("srChips"),SR_FILTERS.map(([k,f])=>`<button class="fchip${SR.filter===k?" on":""}" aria-pressed="${SR.filter===k}"
    onclick="setSrFilter('${k}')">${t("f_"+k)} <b>${res?res.filter(f).length:"-"}</b></button>`).join(""));
  $("srSpin").hidden=!SR.busy;
  const dl=SR.days===1?t("days_1"):t("days_n").replace("{n}",SR.days);
  let sub="";
  if(SR.busy)sub=SR.busyContent?t("sr_searching_content"):t("sr_searching");
  else if(SR.content&&SR.q&&SR.ran!==srKey())sub=t("sr_enter_hint");
  else if(res&&!SR.err)sub=(ranQ?t(res.length===1?"sr_found_1":"sr_found").replace("{n}",res.length).replace("{s}",SR.scanned)
    :t("sr_recent").replace("{n}",res.length))+" · "+dl;
  const se=$("srSub");se.textContent=sub;se.title=sub;
  $("srTable").classList.toggle("busy",SR.busy&&!!res);
  const err=SR.err?srMsg(errLine("runSearch()")):"";
  if(!res){setHtml(body,err||srMsg(`<span class="spin"></span>${t("loading")}`));return;}
  const f=(SR_FILTERS.find(x=>x[0]===SR.filter)||SR_FILTERS[0])[1],rows=res.filter(f);
  let html;
  if(!res.length)html=!ranQ?srMsg(t("sr_empty"))
    :ranContent?srMsg(t("sr_none_content"))
    :srMsg(`${ic("search")} ${t("sr_none")} <button class="sm" onclick="srContentOn()">${ic("search")} ${t("sr_turn_on")}</button>`);
  else if(!rows.length)html=srMsg(t("sr_filter_none"));
  else html=rows.map(srRow).join("");
  setHtml(body,err+html);
}
function showSrMenu(btn){
  const m=$("menuPop"),u=btn.dataset.smenu,r=SRMAP[u];

    +(r?`<button data-copy="${esc(resumeCmd(r))}" data-toast="copied">${ic("term")} <span>${t("copy_resume")}</span></button>`:"");

}

/* resume: confirm modal -> POST /api/sessions/resume */
let resumeUuid=null;
const sanitizeName=s=>String(s||"").replace(/[^A-Za-z0-9._-]+/g,"-").replace(/^[-._]+/,"").slice(0,40).replace(/[-._]+$/,"");
function openResume(u){
  const r=SRMAP[u];if(!r)return;
  resumeUuid=u;
  const name=r.title||r.first||t("untitled");
  $("rsWhat").innerHTML=`<b dir="auto" title="${esc(name)}">${esc(name)}</b>
    <div class="mono" title="${esc(r.dir||"")}">${esc(shortDir(r.dir))}</div><div class="mono">${esc(u)}</div>`;
  $("rsName").value=sanitizeName(r.title)||"session-"+u.slice(0,8);
  $("ovResume").classList.add("on");
  setTimeout(()=>{const i=$("rsName");i.focus();i.select();},30);
}
async function doResume(btn){
  const name=$("rsName").value.trim();
  if(!/^[A-Za-z0-9._-]{1,40}$/.test(name)){toast(t("rs_bad_name"),"bad");$("rsName").focus();return;}
  if(!resumeUuid||btn.disabled)return;
  setBusy(btn,true);
  let ok=false;
  try{
    const body={uuid:resumeUuid,name};if(resumeDry)body.dry=true;
    const r=await fetch("/api/sessions/resume",{method:"POST",body:lb(body)});
    const j=await r.json().catch(()=>({}));
    ok=r.ok&&j.ok!==false&&!j.error;
    const failed=arr(j.results).filter(x=>x&&x.ok===false).map(x=>x.step+(x.detail?": "+x.detail:""));
    toast((j.dry?"[dry] ":"")+(j.message||j.error||(ok?t("done"):t("failed")))+(failed.length?" · "+failed[0]:""),ok?"ok":"bad");
  }catch(e){toast(t("no_server"),"bad");}
  finally{
    setBusy(btn,false);
    if(ok){closeOv("ovResume");if(activeTab==="search")runSearch();loadFallen();loadRc();setTimeout(loadRc,1500);}
  }
}

/* "fell recently" panel on #/sessions + the home card line */
async function loadFallen(){
  if(fallenBusy)return;fallenBusy=true;
  try{
    const r=await fetch(lq("/api/sessions/search?q=&days=1&limit=300"),{cache:"no-store"});
    const j=await r.json();if(!r.ok||j.error)throw new Error(j.error||r.status);
    FALLEN=arr(j.results).filter(x=>x&&x.fallen);
    FALLEN.forEach(x=>{SRMAP[x.uuid]=x;});
  }catch(e){/* keep the last list: this panel is a hint, the sessions table shows server errors */}
  finally{fallenBusy=false;}
  renderFallen();renderCards();
}
function renderFallen(){
  const p=$("fallenPanel");if(!p)return;
  const list=F("restore")?arr(FALLEN):[];p.hidden=!list.length;if(!list.length)return;
  $("fallenSub").textContent=t("fallen_sub").replace("{n}",list.length)+(list.length>FALLEN_MAX?" · "+t("fallen_more").replace("{n}",FALLEN_MAX):"");

/* ═══════════ log viewer (sessions page + #/logs) ═══════════ */
const LOG_SRCS=[["all","log_all"],["watchdog","Watchdog"],["resume","log_resume"],["daemon","Daemon"],["forti","FortiClient"]];
const LG={src:"all",q:"",paused:false,lines:null,err:false,busy:false,stick:true,sig:""};
let logQTimer=null;
async function loadLogs(force){
  if((LG.paused&&!force)||LG.busy)return;
  LG.busy=true;
  const src=LG.src,q=LG.q;
  try{
    const r=await fetch(lq(`/api/logs?src=${encodeURIComponent(src)}&n=200&q=${encodeURIComponent(q)}`),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(src!==LG.src||q!==LG.q)return;          // a newer request is coming
    LG.lines=arr(j&&j.lines);LG.err=false;
    if(src==="all"&&!q)logStat=countHour(LG.lines);
  }catch(e){LG.err=true;}
  finally{LG.busy=false;}
  renderLogs();renderCards();
}
function countHour(lines){const now=Date.now();return lines.filter(l=>{const ms=toMs(l.ts);return ms!=null&&now-ms<=36e5;}).length;}
async function loadLogStat(){
  try{const r=await fetch(lq("/api/logs?src=all&n=200&q="),{cache:"no-store"});if(!r.ok)return;
    const j=await r.json();logStat=countHour(arr(j&&j.lines));renderCards();}catch(e){}
}
function renderLogs(force){
  const b=$("logBody");if(!b)return;
  const pb=$("logPause");
  if(pb){pb.innerHTML=LG.paused?`${ic("play")} <span class="lbl">${t("resume")}</span>`:`${ic("pause")} <span class="lbl">${t("pause")}</span>`;
    pb.setAttribute("aria-label",LG.paused?t("resume"):t("pause"));}
  const forti=F("forticlient");
  if(!forti&&LG.src==="forti"){LG.src="all";LG.lines=null;loadLogs(true);}
  document.querySelectorAll("#logTabs button").forEach(x=>{x.classList.toggle("on",x.dataset.src===LG.src);
    if(x.dataset.src==="forti")x.hidden=!forti;});
  let html;
  if(LG.lines==null)html=LG.err?errLine("loadLogs(true)"):`<div class="tmsg"><span class="spin"></span>${t("loading")}</div>`;
  else{
    html=(LG.err?errLine("loadLogs(true)"):"")+(LG.lines.length?LG.lines.map(l=>{
      const lv=lvOf(l.level);
      return `<div class="ll ${lv}"><span class="ts">${esc(fmtTs(l.ts))}</span>${LG.src==="all"&&l.src?`<span class="src">[${esc(l.src)}]</span>`:""}<span class="m">${esc(l.msg??"")}</span></div>`;
    }).join(""):`<div class="tmsg">${t("log_empty")}</div>`);
  }
  if(html===LG.sig&&!force)return;           // nothing new: keep the user's selection and scroll
  const atBottom=b.scrollHeight-b.scrollTop-b.clientHeight<40;
  b.innerHTML=html;LG.sig=html;
  if(atBottom||LG.stick){b.scrollTop=b.scrollHeight;LG.stick=false;}
}
function setLogSrc(v){if(LG.src===v)return;LG.src=v;LG.lines=null;LG.stick=true;renderLogs();loadLogs(true);}
function onLogQ(v){clearTimeout(logQTimer);logQTimer=setTimeout(()=>{LG.q=v.trim();LG.stick=true;loadLogs(true);},350);}
function toggleLogPause(){LG.paused=!LG.paused;renderLogs(true);if(!LG.paused)loadLogs(true);}
function copyLogs(btn){
  const txt=arr(LG.lines).map(l=>`${fmtTs(l.ts)} ${LG.src==="all"&&l.src?"["+l.src+"] ":""}${l.msg??""}`).join("\n");
  copyText(txt,btn);
}

/* ═══════════ polling ═══════════ */
let pollN=0;
function pollNow(){
  const p=activeTab;
  if(p==="home"||p==="sessions")loadRc();
  if(p==="sessions"||p==="logs")loadLogs();
  if(p==="home"){if(logStat==null)loadLogStat();if(!M)loadMonitorQuiet();}

}
async function loadMonitorQuiet(){
  try{const r=await fetch("/api/monitor");if(!r.ok)return;M=await r.json();renderCards();}catch(e){}
}
setInterval(()=>{
  if(document.hidden)return;
  pollN++;
  const p=activeTab;
  if(p==="home"||p==="sessions")loadRc();
  if(p==="sessions"||p==="logs")loadLogs();
  if(p==="home"&&pollN%6===0)loadLogStat();
  if((p==="home"||p==="sessions")&&pollN%6===0)loadFallen();
},5000);

      toast(j.tmux?`${t("rc_done")} (${j.tmux})`:t("rc_done"));
    });
    return;
  }
  api("/api/launch",{...pendingLaunch,target}).then(j=>{
    closeOv("ovTarget");
    toast(j.tmux?`${t("opened_tmux")} ${j.tmux} ✓`:t("opened_term"));
    if(wantQr&&j.tmux)showRemote(j.tmux);
  });
}

const mrow=(name,hint,end,hintCls="")=>`<div class="row"><div><div class="name">${name}</div>
    ${hint?`<div class="hint ${hintCls}">${hint}</div>`:""}</div>${end?`<div class="end">${end}</div>`:""}</div>`;

function showOut(title,html){

const outBlock=(cmd,out)=>`<div class="muted" style="margin-top:8px;direction:ltr;text-align:left">$ ${esc(cmd)}</div><pre class="out">${esc(out||"")}</pre>`;
async function runUpdate(btn){
  setBusy(btn,true);
  showOut("claude update",`<div class="tmsg" style="padding:0"><span class="spin"></span>${t("updating")}</div>`);
  try{
    const j=await api("/api/update",{});

  }catch(e){showOut("claude update",`<div class="errline">${ic("bad")} ${t("failed")}</div>`);}
  finally{setBusy(btn,false);}

async function runDoctor(btn){
  setBusy(btn,true);
  showOut(t("diag"),`<div class="tmsg" style="padding:0"><span class="spin"></span>${t("running")} (~15s)</div>`);
  try{
    const r=await fetch("/api/doctor");const j=await r.json();
    showOut(t("diag"),arr(j.checks).map(c=>outBlock(c.cmd,c.output)).join("")||`<div class="muted">${t("none")}</div>`);
  }catch(e){showOut(t("diag"),`<div class="errline">${ic("bad")} ${t("no_server")}</div>`);}

function setMetric(btn){

async function loadMonitor(){
  if(!M){
    const ld=`<div class="tmsg"><span class="spin"></span>${t("loading")}</div>`;
    $("chart").innerHTML=ld;
    ["tblModels","tblProjects","tblMatrix"].forEach(id=>$(id).innerHTML=`<tbody><tr><td>${ld}</td></tr></tbody>`);
  }
  try{
    const r=await fetch("/api/monitor");if(!r.ok)throw new Error(r.status);
    M=await r.json();renderMonitor();renderCards();
  }catch(e){if(!M)$("chart").innerHTML=`<div class="tmsg">${errLine("loadMonitor()")}</div>`;}
}
function renderMonitor(){
  if(!M||!$("kpis"))return;
  const lim=M.limits||{};
  const ses=Math.floor(lim.five_hour?.utilization??0),wk=Math.floor(lim.seven_day?.utilization??0);
  const days=arr(M.days),today=days[days.length-1]||{},w=M.week||{};
  let age="";
  const ua=parseInt(lim.updated_at||0);
  if(ua){const m=Math.round((Date.now()/1000-ua)/60);
    age=m<2?t("limits_now"):t("limits_age").replace("{t}",m<60?m+"m":Math.round(m/60)+"h");}
  const ageTag=age?`<span class="tag t-manual q" data-tip="${esc(t("limits_src_tip"))}">${age}</span>`:Q("limits_src_tip");
  const quota=F("rate_limits");
  $("kpis").classList.toggle("two",!quota);$("quotaNote").hidden=quota;
  $("kpis").innerHTML=(quota?`
    <div class="kpi"><div class="l">${t("mon_5h")} ${Q("mon_5h_tip")} ${ageTag}</div>
      <div class="n">${ses}%</div><div class="bar"><i class="${barCls(ses)}" style="width:${ses}%"></i></div></div>
    <div class="kpi"><div class="l">${t("mon_wk")} ${Q("mon_wk_tip")} ${ageTag}</div>
      <div class="n">${wk}%</div><div class="bar"><i class="${barCls(wk)}" style="width:${wk}%"></i></div></div>`:"")+`
    <div class="kpi"><div class="l">${t("mon_today")} ${Q("mon_today_tip")}</div>
      <div class="n">${fmtTok(today.output)}</div><div class="l">${today.messages||0} ${t("msgs")}</div></div>
    <div class="kpi"><div class="l">${t("mon_week")} ${Q("mon_week_tip")}</div>
      <div class="n">${fmtTok(w.output)}</div><div class="l">${w.messages||0} ${t("msgs")} · ${fmtTok(w.cache)} cache</div></div>`;
  drawChart();
  const models=arr(M.models),projects=arr(M.projects);
  const mx1=models[0]?.[1]||1,mx2=projects[0]?.[1]||1;
  const empty=n=>`<tr><td colspan="${n}" class="c-muted">—</td></tr>`;
  const barTbl=(head,col2,rows,mx,fmt,color)=>`<colgroup><col><col style="width:96px"><col style="width:38%"></colgroup>
    <thead><tr><th>${head}</th><th>${col2}</th><th></th></tr></thead><tbody>`+
    (rows.map(([n,c])=>`<tr><td class="code" title="${esc(n)}">${esc(n)}</td><td class="num">${fmt(c)}</td>
      <td><div class="bar" style="margin-top:0"><i style="width:${Math.round(c/mx*100)}%;background:${color}"></i></div></td></tr>`).join("")||empty(3))+`</tbody>`;
  $("tblModels").innerHTML=barTbl(t("model_col"),t("msgs"),models,mx1,v=>v,"var(--blue)");
  $("tblProjects").innerHTML=barTbl(t("proj_col"),"Output",projects,mx2,fmtTok,"var(--accent)");
  const mt=M.matrix||{projects:[],models:[],cells:{}};
  $("tblMatrix").innerHTML=`<colgroup><col style="width:32%">${mt.models.map(()=>"<col>").join("")}</colgroup>
    <thead><tr><th>${t("proj_col")}</th>${mt.models.map(m=>`<th class="code" title="${esc(m)}">${esc(m)}</th>`).join("")}</tr></thead><tbody>`+
    (mt.projects.map(p=>`<tr><td class="code" title="${esc(p)}">${esc(p)}</td>
      ${mt.models.map(m=>{const v=mt.cells[p]?.[m]||0;
        return `<td class="num code" style="${v?"":"color:var(--muted)"}">${v?fmtTok(v):"·"}</td>`;}).join("")}</tr>`).join("")
     ||empty(1+mt.models.length))+`</tbody>`;
}
// the chart is drawn at the real pixel size of its box, so it fills the panel without stretching text
function drawChart(){
  const box=$("chart");if(!M||!box)return;
  const W=Math.floor(box.clientWidth-40),Hh=Math.floor(box.clientHeight-32);
  if(W<120||Hh<120)return;
  const days=arr(M.days),vals=days.map(d=>d[metric]||0),mx=Math.max(...vals,1);
  const P=44,T=20,B=40,H=Hh-T-B,n=Math.max(days.length,1),slot=(W-P)/n,bw=Math.max(8,Math.min(72,slot-16));
  const fmt=metric==="messages"?(v=>v):fmtTok;
  let grid="";
  for(let i=0;i<=3;i++){const y=T+H-Math.round(H*i/3);
    grid+=`<line x1="${P}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="1"/>
      <text x="${P-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(mx*i/3))}</text>`;}
  box.innerHTML=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" style="direction:ltr">
    ${grid}
    ${days.map((d,i)=>{const v=d[metric]||0,h=Math.round(v/mx*H)||1,cx=P+slot*i+slot/2,x=cx-bw/2;
      const last=i===days.length-1;
      return `<g><title>${d.date} · ${fmt(v)}</title>
        <rect x="${x}" y="${T+H-h}" width="${bw}" height="${h}" rx="6"
          fill="${last?"var(--accent)":"var(--blue)"}" opacity="${last?1:.75}"/>
        <text x="${cx}" y="${T+H-h-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${fmt(v)}</text>
        <text x="${cx}" y="${T+H+18}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.date.slice(5).replace("-","/")}</text>
        <text x="${cx}" y="${T+H+32}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${t("dow")[new Date(d.date).getDay()]}</text></g>`;}).join("")}
  </svg>`;
}
let chartRO=null;
function watchChart(){
  if(!window.ResizeObserver||!$("chart"))return;
  if(chartRO)chartRO.disconnect();
  let raf=0;
  chartRO=new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(drawChart);});
  chartRO.observe($("chart"));
}
