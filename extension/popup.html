<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  :root{--bg:#f7f5f1;--card:#fff;--ink:#22201d;--muted:#7a746c;--line:#e6e2da;
    --accent:#c96442;--good:#177245;--good-soft:#e8f5ee;--blue:#2458c5;--code:#f1eee9;--danger:#b91c1c}
  @media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#201f1c;--ink:#ece9e2;
    --muted:#9c968e;--line:#343128;--accent:#e0855f;--good:#4ade80;--good-soft:#132a1c;
    --blue:#7aa5f8;--code:#2a2823;--danger:#f87171}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);
    color:var(--ink);width:330px;font-size:13px;line-height:1.5}
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  header img{width:20px;height:20px;border-radius:5px}
  header b{font-size:13px}
  header .sp{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
  .ic{border:1px solid var(--line);background:var(--card);color:var(--muted);width:26px;height:26px;
    border-radius:7px;cursor:pointer;font-size:12px;line-height:1}
  .ic:hover{color:var(--accent);border-color:var(--accent)}
  .flag{border:none;background:none;cursor:pointer;font-size:13px;opacity:.4;padding:2px}
  .flag.on{opacity:1}
  main{padding:10px 12px}
  .quota{margin-bottom:8px}
  .quota .l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
  .bar{height:5px;background:var(--code);border-radius:99px;overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--good);border-radius:99px}
  .bar i.warn{background:var(--accent)}.bar i.hot{background:var(--danger)}
  .sect{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin:12px 0 5px}
  select{font:inherit;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:4px 8px}
  .preset{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--line)}
  .preset:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .preset .nm{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .preset .est{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;direction:ltr}
  .preset button{font:inherit;font-size:11.5px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:7px;padding:2px 9px;cursor:pointer}
  .preset button:hover{border-color:var(--accent);color:var(--accent)}
  .rowline{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
  .tg{position:relative;width:32px;height:18px;cursor:pointer;flex:none}
  .tg input{opacity:0;width:0;height:0}
  .tg span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.15s}
  .tg span::before{content:"";position:absolute;height:12px;width:12px;top:3px;inset-inline-start:3px;
    background:var(--card);border-radius:50%;transition:.15s}
  .tg input:checked+span{background:var(--good)}
  .tg input:checked+span::before{transform:translateX(-14px)}
  [dir="ltr"] .tg input:checked+span::before{transform:translateX(14px)}
  .off{text-align:center;padding:22px 12px;color:var(--muted)}
  .off code{background:var(--code);border-radius:5px;padding:2px 6px;font-size:11px;direction:ltr;display:inline-block;margin-top:6px}
  .expand{width:100%;margin-top:11px;font:inherit;background:var(--accent);color:#fff;border:none;
    border-radius:9px;padding:7px;cursor:pointer;font-weight:600}
  .expand:hover{filter:brightness(1.06)}
  .toast{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:var(--bg);border-radius:99px;padding:4px 12px;font-size:11.5px;opacity:0;transition:.2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
  <header>
    <img src="icon48.png" alt=""><b>Claude Control</b>
    <span class="sp">
      <button class="flag" id="fl-he" title="עברית">🇮🇱</button>
      <button class="flag" id="fl-en" title="English">🇬🇧</button>
      <button class="ic" id="refresh" title="Refresh">⟳</button>
    </span>
  </header>
  <main id="main"></main>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
